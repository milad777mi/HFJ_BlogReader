name: ساخت خودکار APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدها از مخزن
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: اعطای دسترسی به gradlew
        run: chmod +x gradlew

      - name: ساخت فایل APK (Debug)
        run: ./gradlew assembleDebug

      - name: آپلود فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: HFJ_BlogReader-Debug
          path: app/build/outputs/apk/debug/*.apk
