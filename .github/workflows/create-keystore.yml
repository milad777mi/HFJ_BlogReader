name: ساخت Keystore (یکبار اجرا)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ساخت Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore my-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias 'hfj_key' \
            -storepass 'HFJ@Blog@2026!' \
            -keypass 'HFJ@Blog@2026!' \
            -dname 'CN=HFJ Blog, O=HFJ, C=IQ'

      - name: تبدیل به Base64
        run: |
          base64 my-key.jks > keystore-base64.txt
          echo "=== تعداد کاراکتر ===" 
          wc -c keystore-base64.txt
          echo "=== پیش‌نمایش ==="
          head -c 100 keystore-base64.txt

      - name: آپلود Keystore و Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            my-key.jks
            keystore-base64.txt
          retention-days: 7
